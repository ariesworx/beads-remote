# Runs when a maintainer pushes a version tag (git tag -s v1.2.3 && git push
# origin v1.2.3). Builds the binaries, signs checksums.txt with keyless
# cosign, and attests build provenance; README.md says how to verify both.
name: release
on:
  push:
    tags: ["v*"]
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # keyless signing and provenance through Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
