name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: shellcheck
        run: |
          shellcheck internal/remote/server.sh deploy/bootstrap.sh test/*.sh
          awk '/cat > \/usr\/local\/sbin\/dolt-backup.sh/{f=1;next} /^SCRIPT$/{f=0} f' deploy/bootstrap.sh > "$RUNNER_TEMP/dolt-backup.sh"
          shellcheck "$RUNNER_TEMP/dolt-backup.sh"
