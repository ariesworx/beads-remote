# GoReleaser configuration; .github/workflows/release.yml runs it on a tag.
version: 2
project_name: beads-remote

builds:
  - env: [CGO_ENABLED=0]
    # No Windows: the tunnel relies on OpenSSH control sockets (ssh -S).
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - formats: [tar.gz]
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt

# Keyless: the certificate names this repository's release workflow and tag.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  use: github-native

release:
  draft: false
